plugins {
    id 'net.neoforged.moddev'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

version = "${project_version}-1.21.1-NeoForge"

neoForge {
    version = "${neoforge_21}"

    mods {
        extraquests {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            gameDirectory = layout.projectDirectory.dir('run/client')
        }

        server {
            server()
            gameDirectory = layout.projectDirectory.dir('run/server')
            programArgument '--nogui'
        }
    }
}

sourceSets.main.java.srcDir(rootProject.file('common21/src/main/java'))
sourceSets.main.resources.srcDir(rootProject.file('common21/src/main/resources'))

dependencies {
    implementation "curse.maven:ftb-quests-forge-289412:${ftbquests_neoforge_21}"
    implementation "curse.maven:ftb-library-forge-404465:${ftblibrary_neoforge_21}"
    implementation "curse.maven:ftb-teams-forge-404468:${ftbteams_neoforge_21}"
    implementation "maven.modrinth:extralib:${extralib}-neoforge,1.21.1"

    runtimeOnly "maven.modrinth:architectury-api:${architectury_21}+neoforge"
}

tasks.named('runServer', JavaExec) {
    standardInput = System.in
}

processResources {
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
                'project_name': project_name,
                'project_version': project_version,
                'extralib': extralib
        )
    }
}

build.finalizedBy('versionedRelease')

apply from: rootProject.file('gradle/modrinth.gradle')
apply from: rootProject.file('gradle/curseforge.gradle')
