plugins {
    id 'net.neoforged.moddev'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    neoFormVersion = '1.21.1-20240808.144430'
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly 'net.fabricmc:sponge-mixin:0.15.2+mixin.0.8.7'

    compileOnly 'org.jetbrains:annotations:26.0.2'

    compileOnly "curse.maven:ftb-quests-forge-289412:${ftbquests_neoforge_21}"
    compileOnly "curse.maven:ftb-library-forge-404465:${ftblibrary_neoforge_21}"
    compileOnly "curse.maven:ftb-teams-forge-404468:${ftbteams_neoforge_21}"
    compileOnly "maven.modrinth:extralib:${extralib}-neoforge,1.21.1"
}

tasks.named('test', Test) {
    useJUnitPlatform()
}
