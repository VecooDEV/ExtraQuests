plugins {
    id 'fabric-loom'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    maven { url = 'https://maven.ftb.dev/releases' }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings loom.officialMojangMappings()

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    modCompileOnly "maven.modrinth:architectury-api:${architectury_20}+fabric"
    compileOnly 'net.fabricmc:sponge-mixin:0.15.2+mixin.0.8.7'
    compileOnly 'org.jetbrains:annotations:26.0.2'
    compileOnly "net.fabricmc:fabric-loader:${fabric_loader}"

    modCompileOnly("dev.ftb.mods:ftb-quests-fabric:${ftbquests_common_20}") {
        transitive = false
    }
    modCompileOnly("dev.ftb.mods:ftb-library-fabric:${ftblibrary_common_20}") {
        transitive = false
    }
    modCompileOnly("dev.ftb.mods:ftb-teams-fabric:${ftbteams_common_20}") {
        transitive = false
    }
    modCompileOnly "maven.modrinth:extralib:${extralib}-fabric,1.20.1"
}

tasks.named('remapJar') {
    enabled = false
}

tasks.named('test', Test) {
    useJUnitPlatform()
}
