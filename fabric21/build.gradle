plugins {
    id 'fabric-loom'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

version = "${project_version}-1.21.1-Fabric"

loom {
    mods {
        extraquests {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            runDir 'run/client'
        }

        server {
            runDir 'run/server'
        }
    }
}

sourceSets.main.java.srcDir(rootProject.file('common21/src/main/java'))
sourceSets.main.resources.srcDir(rootProject.file('common21/src/main/resources'))

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_21}"

    modImplementation "curse.maven:ftb-quests-fabric-438496:${ftbquests_fabric_21}"
    modImplementation "curse.maven:ftb-library-fabric-438495:${ftblibrary_fabric_21}"
    modImplementation "curse.maven:ftb-teams-fabric-438497:${ftbteams_fabric_21}"
    modImplementation "maven.modrinth:extralib:${extralib}-fabric,1.21.1"

    modRuntimeOnly "maven.modrinth:architectury-api:${architectury_21}+fabric"
    modRuntimeOnly "teamreborn:energy:${fabric_energy_api_21}"
    modRuntimeOnly "me.lucko:fabric-permissions-api:${fabric_permissions_api_21}"
}

tasks.named('runServer', JavaExec) {
    standardInput = System.in
}

processResources {
    filesMatching('fabric.mod.json') {
        expand(
                'project_name': project_name,
                'project_version': project_version,
                'extralib': extralib
        )
    }
}

build.finalizedBy('versionedRelease')

apply from: rootProject.file('gradle/modrinth.gradle')
apply from: rootProject.file('gradle/curseforge.gradle')
