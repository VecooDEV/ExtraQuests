plugins {
    id 'net.fabricmc.fabric-loom'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

version = "${project_version}-26.1-Fabric"

loom {
    mods {
        extraquests {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            runDir 'run/client'
        }

        server {
            runDir 'run/server'
        }
    }
}

sourceSets.main.java.srcDir(rootProject.file('common261/src/main/java'))
sourceSets.main.resources.srcDir(rootProject.file('common261/src/main/resources'))

repositories {
    maven { url = 'https://maven.ftb.dev/releases' }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.1.2'

    implementation "net.fabricmc:fabric-loader:${fabric_loader}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_261}"

    implementation("dev.ftb.mods:ftb-quests-fabric:${ftbquests_261}") {
        transitive = false
    }
    implementation("dev.ftb.mods:ftb-library-fabric:${ftblibrary_261}") {
        transitive = false
    }
    implementation("dev.ftb.mods:ftb-teams-fabric:${ftbteams_261}") {
        transitive = false
    }
    implementation 'de.marhali:json5-java:3.0.0'
    implementation "maven.modrinth:extralib:${extralib}-fabric,26.1"

    runtimeOnly "me.lucko:fabric-permissions-api:${fabric_permissions_api_261}"
}

tasks.named('runServer', JavaExec) {
    standardInput = System.in
}

processResources {
    filesMatching('fabric.mod.json') {
        expand(
                'project_name': project_name,
                'project_version': project_version,
                'extralib': extralib
        )
    }
}

build.finalizedBy('versionedRelease')

apply from: rootProject.file('gradle/modrinth.gradle')
apply from: rootProject.file('gradle/curseforge.gradle')
