plugins {
    id 'net.neoforged.moddev'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    neoFormVersion = '26.1.2-1'
}

repositories {
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation("dev.ftb.mods:ftb-library:${ftblibrary_261}") {
        transitive = false
    }
    testImplementation 'de.marhali:json5-java:3.0.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor "org.projectlombok:lombok:${lombok}"

    compileOnly 'net.fabricmc:sponge-mixin:0.15.2+mixin.0.8.7'

    compileOnly 'org.jetbrains:annotations:26.0.2'

    compileOnly("dev.ftb.mods:ftb-quests-neoforge:${ftbquests_261}") {
        transitive = false
    }
    compileOnly("dev.ftb.mods:ftb-library-neoforge:${ftblibrary_261}") {
        transitive = false
    }
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${ftbteams_261}") {
        transitive = false
    }
    compileOnly 'de.marhali:json5-java:3.0.0'
    compileOnly "maven.modrinth:extralib:${extralib}-neoforge,26.1"
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

tasks.named('test', Test) {
    useJUnitPlatform()
}
